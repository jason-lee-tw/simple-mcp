services:
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
      - "4317:4317"
    volumes:
      - phoenix_data:/phoenix
    environment:
      - PHOENIX_WORKING_DIR=/phoenix

  chatbot:
    build:
      context: .
      dockerfile: docker/local/chatbot/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - chat-bot/.env
    environment:
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:4317
      - PHOENIX_BASE_URL=http://phoenix:6006
    depends_on:
      - phoenix
    develop:
      watch:
        - action: sync
          path: ./chat-bot/src
          target: /app/src

volumes:
  phoenix_data:
